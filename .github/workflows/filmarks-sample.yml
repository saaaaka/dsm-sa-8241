name: filmarks-sample
on: workflow_dispatch
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python filmarks.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SAMPLE: "1"
      - run: |
          git config user.name filmarks-bot; git config user.email filmarks-bot@users.noreply.github.com
          git add filmarks_sample.md && git commit -m "サンプル出力" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
