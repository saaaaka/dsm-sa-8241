name: fm recheck
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -u tools/fm_recheck.py
      - run: |
          git config user.name "filmarks-bot"; git config user.email "filmarks-bot@users.noreply.github.com"
          git add filmarks_weekly.md; git commit -m "filmarks_weekly.md 修正版" && git push || true
