name: 新着チェック

on:
  schedule:
    - cron: "*/5 * * * *"   # 5分おき（GitHubの混雑で遅れることあり）
  workflow_dispatch:         # 手動でも実行できる

permissions:
  contents: write

concurrency:
  group: dsm-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 新着を確認して通知
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py
      - name: 確認済みリストを保存
        run: |
          git config user.name "dsm-bot"
          git config user.email "dsm-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "seen.json 更新" && git push)
