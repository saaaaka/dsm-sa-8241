name: Filmarks 新着チェック

on:
  schedule:
    - cron: "0 9 * * *"    # 毎日 18:00（日本時間）に起動。2026-11-19 から3日おきの日だけ実行
  workflow_dispatch:        # 手動でも実行できる
    inputs:
      report:
        description: "結果を通知する"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: filmarks-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 実行する日か判定（2026-11-19 から3日おき）
        id: day
        env:
          TZ: Asia/Tokyo
        run: |
          days=$(( ( $(date -d "$(date +%F)" +%s) - $(date -d 2026-11-19 +%s) ) / 86400 ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((days % 3)) -eq 0 ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.day.outputs.run == '1'
        uses: actions/checkout@v4
      - if: steps.day.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 全ページを読んで新着を通知
        if: steps.day.outputs.run == '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPORT: ${{ (github.event_name == 'schedule' || inputs.report) && '1' || '' }}
        run: python -u filmarks.py
      - name: 記録を保存
        if: steps.day.outputs.run == '1'
        run: |
          git config user.name "filmarks-bot"
          git config user.email "filmarks-bot@users.noreply.github.com"
          git add filmarks_catalog.json $(ls filmarks_weekly.md 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "filmarks_catalog.json 更新"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
