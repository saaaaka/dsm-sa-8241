name: Filmarks 新着チェック

on:
  schedule:
    - cron: "13 3 * * *"   # 毎日 12:13（日本時間）にチェックだけ（通知なし）
    - cron: "0 9 * * *"    # 毎日 18:00（日本時間）。2026-11-19 から3日おきの日だけ通知
  workflow_dispatch:        # 手動でも実行できる
    inputs:
      report:
        description: "前回からの追加をすぐ通知する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: filmarks-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 通知する日か判定（2026-11-19 から3日おき）
        id: day
        env:
          TZ: Asia/Tokyo
        run: |
          days=$(( ( $(date -d "$(date +%F)" +%s) - $(date -d 2026-11-19 +%s) ) / 86400 ))
          if [ "${{ github.event.schedule }}" = "0 9 * * *" ] && [ $((days % 3)) -eq 0 ]; then
            echo "report=1" >> "$GITHUB_OUTPUT"
          fi
      - name: 新着の高評価作品を確認して通知
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPORT: ${{ (steps.day.outputs.report == '1' || inputs.report) && '1' || '' }}
        run: python filmarks.py
      - name: 確認済みリストを保存
        run: |
          git config user.name "filmarks-bot"
          git config user.email "filmarks-bot@users.noreply.github.com"
          git add filmarks_seen.json $(ls filmarks_weekly.md 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "filmarks_seen.json 更新"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
