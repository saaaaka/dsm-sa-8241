name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python probe.py > probe_out.txt 2>&1 || true
      - run: |
          git config user.name dsm-bot; git config user.email dsm-bot@users.noreply.github.com
          git add probe_out.txt; git commit -m probe; git pull --rebase -q; git push
