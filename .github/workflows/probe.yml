name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: python
        run: |
          import urllib.request, re
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          for u in ["dramas/9422/13347","movies/118700","dramas/18426/24665"]:
              print("===",u, flush=True)
              try:
                  req=urllib.request.Request("https://filmarks.com/"+u,headers={"User-Agent":UA,"Accept-Language":"ja","Accept":"text/html,application/xhtml+xml,*/*;q=0.8"})
                  h=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
              except Exception as e:
                  print("ERR",e); continue
              print(len(h))
              for m in re.finditer(r'(?i)vod', h):
                  print(repr(h[max(0,m.start()-150):m.start()+250]))
                  print("-")
              print("--- 見放題")
              for m in list(re.finditer('見放題', h))[:8]:
                  print(repr(h[max(0,m.start()-300):m.start()+300]))
